services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Camp_Dev_Passw0rd!'
      MSSQL_PID: Developer
    ports:
      - '14333:1433'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Local WorkOS AuthKit. Seeded personas live in infra/workos; no WorkOS dashboard or keys needed.
  workos:
    image: ghcr.io/workos/emulate:0.13.1
    command: ['--host', '0.0.0.0', '--interactive']
    environment:
      WORKOS_EMULATE_ISSUER: http://localhost:4100
    volumes:
      - ./infra/workos/workos-emulate.config.yaml:/app/workos-emulate.config.yaml:ro
    ports:
      - '4100:4100'

  api:
    build: ./api
    environment:
      ASPNETCORE_URLS: http://+:8080
      WorkOS__ApiBaseUrl: http://workos:4100
      WorkOS__PublicBaseUrl: http://localhost:4100
      ConnectionStrings__Default: 'Server=db,1433;Database=CampRegistration;User Id=sa;Password=Camp_Dev_Passw0rd!;TrustServerCertificate=True'
    ports:
      - '5080:8080'
    depends_on:
      db:
        condition: service_healthy
      workos:
        condition: service_started

  web:
    build: ./web
    ports:
      - '5173:80'
    depends_on:
      - api
